<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="100%" stop-color="#ba265d" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 242, 254, 0.07)" stroke-width="1" />
      <circle cx="40" cy="0" r="1.5" fill="rgba(0, 242, 254, 0.25)" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-pulse {
        animation: pulseBg 6s ease-in-out infinite alternate;
      }
      @keyframes pulseBg {
        0% { opacity: 0.35; }
        100% { opacity: 0.75; }
      }
      .node-pulse {
        animation: nodePulse 2.5s infinite alternate;
      }
      @keyframes nodePulse {
        0% { r: 3px; opacity: 0.5; }
        100% { r: 6px; opacity: 1; filter: drop-shadow(0 0 6px #00f2fe); }
      }
      .laser-scan {
        animation: scanLine 7s linear infinite;
      }
      @keyframes scanLine {
        0% { transform: translateY(-40px); opacity: 0; }
        15% { opacity: 0.7; }
        85% { opacity: 0.7; }
        100% { transform: translateY(440px); opacity: 0; }
      }
      .signal-flow {
        stroke-dasharray: 8 16;
        animation: dashFlow 25s linear infinite;
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -1000; }
      }
      .floating-badge {
        animation: floatBadge 4s ease-in-out infinite alternate;
      }
      @keyframes floatBadge {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.5px;
      }
      .pill-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-weight: 600;
        font-size: 11px;
      }
    </style>
  </defs>

  <!-- Deep Cyber Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Animated Grid Overlay -->
  <rect width="100%" height="100%" fill="url(#cyberGrid)" />

  <!-- Ambient Glow Cones in Background -->
  <circle cx="200" cy="80" r="180" fill="#00f2fe" opacity="0.06" filter="url(#neonGlow)" class="bg-pulse" />
  <circle cx="1000" cy="300" r="220" fill="#ff3366" opacity="0.05" filter="url(#neonGlow)" class="bg-pulse" />
  <circle cx="600" cy="380" r="160" fill="#4facfe" opacity="0.08" filter="url(#neonGlow)" />

  <!-- Background Signal / Circuit Flow Lines -->
  <g opacity="0.35" class="signal-flow">
    <path d="M 50,340 L 320,340 L 390,290 L 780,290 L 840,350 L 1150,350" fill="none" stroke="#00f2fe" stroke-width="2" />
    <path d="M 80,60 L 260,60 L 320,110 L 890,110 L 960,50 L 1120,50" fill="none" stroke="#4facfe" stroke-width="1.5" />
    <path d="M 150,380 L 400,380 L 460,330 L 740,330 L 800,380 L 1050,380" fill="none" stroke="#ff3366" stroke-width="1" />
  </g>

  <!-- Telemetry Scan Line Sweeper (Dynamic Aspect) -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#accentGrad)" stroke-width="2" filter="url(#subtleGlow)" class="laser-scan" opacity="0.5" />

  <!-- Dynamic Corner Circuit Points -->
  <circle cx="390" cy="290" r="4" fill="#00f2fe" class="node-pulse" />
  <circle cx="840" cy="350" r="4" fill="#00f2fe" class="node-pulse" />
  <circle cx="320" cy="110" r="3.5" fill="#4facfe" class="node-pulse" />
  <circle cx="890" cy="110" r="3.5" fill="#4facfe" class="node-pulse" />

  <!-- Top Category Indicator Pill -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <rect x="-165" y="-16" width="330" height="32" rx="16" fill="rgba(0, 242, 254, 0.1)" stroke="#00f2fe" stroke-width="1.2" />
    <circle cx="-142" cy="0" r="4.5" fill="#00f2fe" class="node-pulse" />
    <text x="6" y="4.5" fill="#00f2fe" class="pill-text" letter-spacing="1.5">ENTERPRISE DFIR &amp; LIVE RESPONSE</text>
  </g>

  <!-- Main Hero Title & Foreground Shield (Always Foreground) -->
  <g transform="translate(600, 155)" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff" font-size="44" class="title-text" filter="url(#subtleGlow)">
      Awesome Remote Incident Remediation
    </text>
    <text x="0" y="44" fill="url(#accentGrad)" font-size="34" class="title-text">
      &amp; Digital Forensics
    </text>
  </g>

  <!-- Subtitle (Clear and Readable Foreground) -->
  <g transform="translate(600, 245)" text-anchor="middle">
    <text x="0" y="0" fill="#94a3b8" font-size="16" class="subtitle-text">
      Curated Telemetry, Live Shells, Memory Triage &amp; Automated Threat Remediation
    </text>
  </g>

  <!-- Floating Feature Badges (Interactive Modern Feel) -->
  <g class="floating-badge">
    <!-- Badge 1: Live Terminal Shells -->
    <g transform="translate(190, 310)">
      <rect x="0" y="0" width="180" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="24" cy="21" r="5" fill="#38bdf8" />
      <text x="40" y="26" fill="#f8fafc" class="pill-text">⚡ LIVE RESPONSE</text>
    </g>

    <!-- Badge 2: Memory & Artifact Forensics -->
    <g transform="translate(415, 310)">
      <rect x="0" y="0" width="180" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="#00f2fe" stroke-width="1.2" />
      <circle cx="24" cy="21" r="5" fill="#00f2fe" />
      <text x="40" y="26" fill="#f8fafc" class="pill-text">🔬 MEMORY TRIAGE</text>
    </g>

    <!-- Badge 3: Fleet Hunt Automation -->
    <g transform="translate(640, 310)">
      <rect x="0" y="0" width="180" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="#818cf8" stroke-width="1.2" />
      <circle cx="24" cy="21" r="5" fill="#818cf8" />
      <text x="40" y="26" fill="#f8fafc" class="pill-text">🛡️ FLEET HUNTING</text>
    </g>

    <!-- Badge 4: Automated Remediation -->
    <g transform="translate(865, 310)">
      <rect x="0" y="0" width="185" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="#ff3366" stroke-width="1.2" />
      <circle cx="24" cy="21" r="5" fill="#ff3366" />
      <text x="40" y="26" fill="#f8fafc" class="pill-text">🎯 ACTIVE REMEDIATION</text>
    </g>
  </g>

  <!-- High-tech Sleek Base Frame Border -->
  <rect x="1" y="1" width="1198" height="398" rx="8" fill="none" stroke="rgba(0, 242, 254, 0.25)" stroke-width="2" />
  <line x1="20" y1="1" x2="140" y2="1" stroke="#00f2fe" stroke-width="3" />
  <line x1="1060" y1="399" x2="1180" y2="399" stroke="#00f2fe" stroke-width="3" />
</svg>
